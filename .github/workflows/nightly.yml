# .github/workflows/nightly.yml
#
# Two jobs that deliberately do not depend on each other:
#
#   suite — every spec under tests/, run lane-by-lane
#   sweep — the standalone data sweeper
#
# The sweep is NOT chained to the journey job. Data gets left behind exactly
# when a run crashes, and a cleanup step that only runs after a successful
# test job is a cleanup step that never runs when it is needed. Both jobs are
# scheduled independently and neither blocks the other.
name: CPQ Nightly

on:
  schedule:
    # Journeys at 23:00 UTC, sweep at 01:00 UTC — 04:30 and 06:30 IST, which is
    # what these are actually scheduled around (IST is UTC+5:30 with no DST, so
    # the mapping is fixed year-round). Note the journey cron fires on the
    # PREVIOUS UTC day to the IST morning it belongs to; the two still land two
    # hours apart, which is the part that matters. That gap is not cosmetic —
    # it is what keeps the sweep from racing a suite run still writing records,
    # and it absorbs GitHub's habit of firing scheduled workflows late.
    #
    # Two hours is a real budget rather than a round number: the full suite is
    # ~19 minutes locally at --max-concurrent=3, and the job is capped at 120
    # minutes below. If the suite ever grows past the gap, move the sweep cron
    # later — do NOT chain it to this job, for the reason stated above.
    #
    # These strings are matched LITERALLY by each job's `if:` below, which is
    # how one workflow file runs two independent schedules. Change a cron here
    # without changing its `if:` and that job simply never runs again — no
    # error, no failed run, nothing in the Actions tab to notice.
    - cron: '0 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [developer, sandbox, uat]
        # Developer — the only org with a Connected App configured for the JWT
        # Bearer flow. See the note in playwright.yml. This one also decides
        # which org the SWEEPER deletes from, so changing it points a
        # destructive job at a different org.
        default: developer
      run_sweep:
        description: 'Run the data sweeper (deletes records past retention)'
        type: boolean
        default: false

jobs:
  # The FULL suite — every spec under tests/, not just the journeys. The merge
  # gate in playwright.yml runs a subset by design (it excludes journeys,
  # quota-heavy and work-in-progress tests, and it has to finish while someone
  # waits on a pull request), so this is the only scheduled run that covers
  # everything. The @domain:orders / contracts / amend / renewal / assets tags
  # exist ONLY on journey stages and are therefore reachable nowhere else.
  suite:
    if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the full suite
        env:
          SF_ENV: ${{ github.event.inputs.environment || 'developer' }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
        # test:parallel, NOT `playwright test tests/`. Three reasons, and the
        # first is a correctness one rather than a speed one:
        #
        #   1. The journey stages hand state to each other through
        #      artifacts/state and must run in order, in one worker. Playwright's
        #      serial mode only orders tests WITHIN a file, so a plain run with
        #      more than one worker starts subscription-renewal before
        #      subscription-lifecycle has written the state file it reads. The
        #      journeys lane pins --workers=1 internally, which is what
        #      test:journey used to do here.
        #   2. A coverage guard aborts the run naming any spec no lane claims,
        #      so a spec added later cannot silently go unrun in the nightly.
        #   3. It finishes in the slowest lane's time rather than the sum —
        #      measured 19.1 minutes against a lane-duration sum of 51.9.
        #
        # Concurrency defaults to 3 lanes at a time. If the runner or the org
        # struggles, pass --max-concurrent=2 rather than dropping back to a
        # serial run, which would cost ~30 minutes and fix nothing else.
        run: npm run test:parallel
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-suite
          # playwright-report/ and test-results/ hold one subdirectory PER LANE
          # (the reporter and artifact paths are split so concurrent lanes do
          # not overwrite each other), so these paths capture every lane.
          path: |
            playwright-report/
            test-results/
            artifacts/
            data/e2e-run-ledger.xlsx
          retention-days: 30
      # allure-results/ is uploaded SEPARATELY rather than inside report-suite,
      # because it holds its own copy of every evidence attachment — one PNG per
      # documented validation point, already captured above under artifacts/ —
      # and carrying it in both would double the storage for a directory only
      # the publish job below reads.
      #
      # BEHAVIOUR CHANGE for anyone with the old habit: raw Allure results now
      # come from the allure-results-suite artifact, not from report-suite.
      #
      # It is deliberately NOT split per lane. allure-playwright writes one
      # uniquely-named file per test, so concurrent lanes can share one
      # directory safely, and keeping them together is what lets a single
      # generate cover the whole run.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-suite
          path: allure-results/
          retention-days: 30

  # Publishes the Allure report from the run above to GitHub Pages, as a single
  # always-current report at the site root. No org access, no Salesforce
  # secrets — it only reads an artifact and deploys static files.
  #
  # REQUIRES A ONE-TIME MANUAL SETTING that cannot be scripted: Settings →
  # Pages → Build and deployment → Source must be "GitHub Actions". Without it,
  # actions/deploy-pages fails.
  publish:
    needs: suite
    # Both halves of this guard are load-bearing, and they guard different things:
    #
    #   !cancelled()                  — a FAILED suite still publishes its report.
    #                                   A report you only get when everything
    #                                   passed is a report you never need.
    #   needs.suite.result != 'skipped' — the sweep-only 01:00 schedule does not
    #                                   run `suite`, and a skipped dependency
    #                                   still satisfies !cancelled(). Without
    #                                   this, the sweep schedule would try to
    #                                   publish a report from a run that never
    #                                   happened.
    if: ${{ !cancelled() && needs.suite.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoped to this job, not the workflow: nothing else here needs to write to
    # Pages or mint an OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Two overlapping Pages deployments race each other. Queue rather than
    # cancel — a half-deployed site is worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # allure-commandline is a Java program. ubuntu-latest currently ships a
      # JDK, but that is a property of the runner image rather than a promise —
      # installing one explicitly means an image change cannot turn into a
      # mystery failure in a job nobody watches at 04:30.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - id: pages
        uses: actions/configure-pages@v6
      # Allure's trend is read out of allure-results/history/ — it is NOT
      # derived from the results. The only copy of those files is the currently
      # published site (allure-report/ is gitignored and CI starts from a clean
      # checkout), so they have to be fetched back before generating.
      #
      # Every fetch tolerates a miss. A first publish has no site to read, and
      # an access-controlled Pages site answers 403. Both are expected, neither
      # is a failure, and prepare-allure.js logs which happened.
      - name: Fetch the published report's trend history
        run: |
          mkdir -p .allure-history
          for file in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl --fail --silent --show-error \
              --output ".allure-history/$file" \
              "${{ steps.pages.outputs.base_url }}/history/$file" || true
          done
          ls -l .allure-history || true
      # Into the workspace root, so allure-results/ lands exactly where
      # playwright.config.js puts it locally and `npm run allure:ci` needs no
      # CI-specific path. This job consumes ONLY allure-results-suite — never
      # report-suite, which holds the Playwright report and the ledger and is
      # not published anywhere.
      #
      # Pinned to v7 to match actions/upload-artifact@v7 above — the two are
      # one artifact generation and are kept in step deliberately.
      - uses: actions/download-artifact@v7
        with:
          name: allure-results-suite
          path: allure-results
      # The same entry point a human runs locally. Inlining `allure generate`
      # here would be a second definition of how the report is built, and the
      # empty-results guard lives inside the script rather than in the YAML.
      - run: npm run allure:ci
      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v5

  sweep:
    if: github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run_sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sweep E2E data past retention
        env:
          SF_ENV: ${{ github.event.inputs.environment || 'developer' }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
        # --confirm is required for the sweeper to delete anything; without it
        # the script prints its plan and exits.
        run: npm run cleanup:e2e -- --confirm
